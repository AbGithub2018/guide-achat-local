name: Extraction Circulaires QC (Mercredi & Jeudi 3h17)

on:
  schedule:
    # 08h17 UTC = 03h17 EST (minute décalée pour éviter la congestion GitHub)
    - cron: '17 8 * * 3,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraction-circulaires:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer les fichiers du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy pandas rapidocr_onnxruntime

      - name: Exécuter l'extraction automatique des circulaires
        run: python update_circulaires.py

      - name: Mettre à jour circulaires_qc.csv sur GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add circulaires_qc.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "MAJ automatique circulaires semaine" && git pull --rebase origin main && git push)
