name: Mise à jour automatique du Sitemap

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'sitemap.xml'
  schedule:
    - cron: '0 13 * * 4'

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Générer sitemap.xml avec la date du jour
        run: |
          TODAY=$(date -u +'%Y-%m-%d')
          cat <<EOF > sitemap.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://sitemaps.org">
            <url>
              <loc>https://epicerieqc.github.io</loc>
              <lastmod>${TODAY}</lastmod>
              <changefreq>daily</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          EOF

      - name: Enregistrer la mise à jour si la date a changé
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour automatique de la date du sitemap" && git push)
