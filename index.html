<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Guide d'Achat Local</title>
    <!-- Chargement de la bibliothèque de scan par caméra -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; border-top: 5px solid #003366; }
        h1 { color: #003366; font-size: 22px; margin-bottom: 5px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        .counter { font-size: 15px; color: #333; margin: 15px 0; font-weight: bold; }
        .btn-sync { background-color: #2e7d32; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 15px; }
        .btn-sync:hover { background-color: #1b5e20; }
        #reader { width: 100%; margin-top: 15px; border-radius: 8px; overflow: hidden; }
        .success-flash { color: #2e7d32; font-weight: bold; margin-top: 10px; min-height: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h1>⚜️ MON GUIDE D'ACHAT LOCAL 🍁</h1>
    <div class="subtitle">Scannez vos codes-barres même sans réseau au fond du magasin.</div>
    
    <!-- Zone de scan de la caméra -->
    <div id="reader"></div>
    
    <div class="counter"><span id="count">0</span> produit(s) en mémoire tampon locale</div>
    <div id="flash-message" class="success-flash"></div>

    <button class="btn-sync" onclick="synchroniserDonnees()">🔄 Synchroniser avec Google Sheets</button>
</div>

<script>
    // URL de votre script Google Apps (pensez à mettre la vôtre après avoir republié le script)
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz5agGszemOQTkN5dUo11aZy8mZ7HtSlDvlEz328vVmo2nC7UMx26h4D0DxO0P1NSWR/exec";

    // Mettre à jour le compteur visuel au chargement
    function majCompteur() {
        let produits = JSON.parse(localStorage.getItem('produits_scannes')) || [];
        document.getElementById('count').innerText = produits.length;
    }

    // Fonction appelée dès qu'un code-barres est détecté par la caméra
    function onScanSuccess(decodedText, decodedResult) {
        let produits = JSON.parse(localStorage.getItem('produits_scannes')) || [];
        
        // Ajouter le code avec l'heure du scan
        produits.push({
            code: decodedText,
            date: new Date().toLocaleString("fr-CA")
        });
        
        // Sauvegarder dans la mémoire du téléphone (hors réseau)
        localStorage.setItem('produits_scannes', JSON.stringify(produits));
        majCompteur();
        
        // Petit message de confirmation visuel
        document.getElementById('flash-message').innerText = "Code " + decodedText + " enregistré !";
        setTimeout(() => { document.getElementById('flash-message').innerText = ""; }, 2000);
    }

    // Initialisation de la caméra
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
        fps: 10, 
        qrbox: { width: 250, height: 150 }, // Format rectangulaire adapté aux codes-barres
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    });
    html5QrcodeScanner.render(onScanSuccess);

    // Fonction pour envoyer au Google Sheet quand on retrouve le réseau
    function synchroniserDonnees() {
        let produits = JSON.parse(localStorage.getItem('produits_scannes')) || [];
        
        if (produits.length === 0) {
            alert("Aucun produit en mémoire à synchroniser.");
            return;
        }

        // Changement : On envoie le JSON sous forme de chaîne brute pour éviter le blocage CORS de Google Apps Script
        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "cors", 
            body: JSON.stringify({ actions: "sync", donnees: produits })
        })
        .then(response => {
            if (response.ok || response.type === 'opaque') {
                alert("Synchronisation réussie avec Google Sheets !");
                localStorage.removeItem('produits_scannes'); // Vide la mémoire locale uniquement si l'envoi a fonctionné
                majCompteur();
            } else {
                alert("Erreur lors de l'envoi des données au serveur.");
            }
        })
        .catch(error => {
            alert("Erreur de connexion. Vérifiez votre réseau : " + error);
        });
    }

    // Charger le compteur au démarrage de la page
    majCompteur();
</script>

</body>
</html>
